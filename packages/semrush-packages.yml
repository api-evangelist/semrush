provider: Semrush
providerId: semrush
description: >-
  Published package inventory for Semrush. The headline finding is a gap: Semrush ships no
  first-party API client library in any registry. Its developer documentation teaches raw
  HTTP with curl and offers no SDK download, and the only first-party npm presence is the
  Intergalactic design system, which is UI components rather than an API client. Every
  Semrush API wrapper on npm and PyPI is third-party and years stale.

official_api_sdk: false
official_api_sdk_note: >-
  Checked npm (registry search for "semrush", plus @semrush/* scope), PyPI, and the
  github.com/semrush organization on 2026-08-13. No first-party client for the Standard,
  SEO, Trends, Projects, Local or Map Rank Tracker APIs exists. The @semrush npm scope is
  unclaimed — @semrush/mcp returns 404.


description: >-
  Semrush publishes one client-side component surface: Intergalactic, its open-source React
  design system, distributed on npm under the @semcore scope and documented on the same
  developer host as the API reference. It is a UI library for building Semrush-styled
  interfaces — including App Center apps — not an embedded-dashboard or hosted-widget product.
  Semrush publishes no embeddable data widget, no web component, and no hosted prebuilt
  surface for its marketing data.


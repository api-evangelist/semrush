description: >-
  Crosswalk between the Semrush MCP tool surface and the REST operations the catalog holds
  an OpenAPI for. The honest finding is that the two do not overlap at all: the only OpenAPI
  Semrush publishes describes the App Center partner/billing surface, while the MCP server
  fronts the Trends, SEO and Projects data APIs, for which Semrush publishes no machine-readable
  contract. crosswalk[] is therefore empty by measurement, not by omission.

surfaces:

    file: openapi/_original/semrush-openapi.yml
    source: https://github.com/semrush/app-center-openapi/blob/main/openapi_spec.yaml
    title: Semrush AppCenter API
    server: https://api.semrush.com
    operations: 6
    gated: false
    note: >-
      Covers App Center partner integration only — JWT issuance, viewer status, and the
      Hermes subscription/event surface. It does not describe any Semrush marketing data report.
  mcp:
    url: https://mcp.semrush.com/v2/mcp
    transport: streamable-http
    gated: true
    note: >-
      tools/list returns 401 before the handshake. Tool names and inputSchemas require an
      authenticated OAuth introspection, so no tool rows are asserted here.
  graphql:
    endpoint: null
    gated: null
    note: >-
      Semrush ships no GraphQL endpoint. graphql/semrush-schema.graphql in this repo is an
      explicitly conceptual sketch, not a served schema, and is deliberately excluded from
      this crosswalk.
  rest_documented_only:
    reference: https://developer.semrush.com/api/v4/
    note: >-
      The APIs the MCP server actually fronts are documented in prose with request examples
      but ship no OpenAPI. Their real, published endpoint paths are listed under
      undescribed_rest[] so the gap is measurable rather than invisible.


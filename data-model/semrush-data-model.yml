entities_from_docs:
  note: >-
    Documented in the v4 reference with named fields and identifiers, but with no OpenAPI,
    JSON Schema or any other machine-readable definition. Listed so the modelled surface is
    visible; not derived from a contract.
  entities:
  - name: Project
    api: Projects API v4
    identifier: project_id (numeric, e.g. 643526670283248)
    collection: /apis/v4/projects/v1/projects
    reference: https://developer.semrush.com/api/v4/projects/projects/
  - name: Location
    api: Listing Management API v4
    identifier: location_id (32-char hex)
    collection: /apis/v4/local/v1/locations
    has_many: [Listing, Image]
    reference: https://developer.semrush.com/api/v4/local/listing-management/
  - name: Listing
    api: Listing Management API v4
    identifier: listing_id (32-char hex)
    belongs_to: Location
    collection: /apis/v4/local/v1/locations/{location_id}/listings
  - name: Image
    api: Listing Management API v4
    identifier: image_id (32-char hex)
    belongs_to: Location
    collection: /apis/v4/local/v1/locations/{location_id}/images
  - name: Category
    api: Listing Management API v4
    collection: /apis/v4/local/v1/categories
  - name: PaymentOption
    api: Listing Management API v4
    belongs_to: Location
  - name: MoreHourType
    api: Listing Management API v4
    belongs_to: Location
  - name: Campaign
    api: Map Rank Tracker API
    identifier: campaign_id (UUID)
    collection: /apis/v4/map-rank-tracker/v0/campaigns
    has_many: [Keyword, Heatmap, Metric, Competitor]
    reference: https://developer.semrush.com/api/v4/local/map-rank-tracker/
  - name: Backlink
    api: Backlinks API v4
    fields_reference: >-
      anchor, backlinks_count, domain_score, page_score, first_seen_at, is_follow, is_lost,
      is_new, is_nofollow, is_image, is_form, is_frame, is_sponsored, is_ugc, ip_address,
      external_links_count, internal_links_count, image_alt, image_url
    reference: https://developer.semrush.com/api/v4/seo/backlinks/
  - name: Keyword
    api: Keywords API v4
    fields_reference: cpc, competitive_density, intents, volume
    reference: https://developer.semrush.com/api/v4/seo/keyword-reports/

id_conventions:
- surface: Listing Management API v4
  format: 32-character lowercase hexadecimal
  example_shape: 04f447bda9f845d691fb4cc37daba031
- surface: Map Rank Tracker API
  format: RFC 4122 UUID
  example_shape: 0410f1d2-2bdb-4554-a761-0c15d636105b
- surface: Projects API v4
  format: numeric string
- surface: App Center / Hermes
  format: mixed — integer user_id and subscription_id, string event id
note_on_id_conventions: >-
  Four different identifier formats across five APIs, with no prefixed or self-describing ids
  anywhere. An agent holding a bare id cannot tell which API it belongs to.


    - v4
  - api: Backlinks
    version: v4 (/apis/v4/backlinks/v1/)
  - api: Keywords
    version: v4 (/apis/v4/keywords/v1/)
  - api: Projects
    version: v4 (/apis/v4/projects/v1/)
  - api: Listing Management
    version: v4 (/apis/v4/local/v1/)
  - api: Map Rank Tracker
    version: v4 (/apis/v4/map-rank-tracker/v0/)
  feed: null
  feed_note: No RSS/Atom or JSON feed is published for the release notes.

entries:
- date: '2026-07-15'
  breaking: false
  additions: true
  highlights:
  - Documentation reorganized by API version with a v3/v4 version selector across references, authorization guides and resources.
  - Version-specific API keys introduced — a v3 key works only with Version 3 APIs and a v4 key only with Version 4 APIs.
  - New per-version quick-start guides published.
- date: '2026-07-02'
  breaking: false
  additions: true
  deprecations: true
  highlights:

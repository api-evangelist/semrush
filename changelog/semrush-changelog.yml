description: >-
  Semrush maintains a dated API release-notes page on its developer portal. Entries are
  human-authored prose grouped by month and day; there is no machine-readable feed, no
  RSS, and no semantic version number attached to a release. The changelog is the only
  published record of the v3 to v4 migration currently under way across every Semrush API.

scheme:
  versioning: major-version families (v3, v4) plus a per-API path version (v0, v1)
  current_versions:
